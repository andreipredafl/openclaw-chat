server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. With a variable in proxy_pass, nginx resolves the backend name
    # per request instead of once at start, so a recreated backend container is
    # found without an nginx restart.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # /api/chat is an SSE stream. Buffered, the page would see nothing until the end.
        proxy_buffering off;
        # Time without a byte from the backend. A model can think a while before the first delta.
        proxy_read_timeout 300s;
    }
}
