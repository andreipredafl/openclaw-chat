# OpenClaw gateway, backend, frontend. Start with: docker compose up --build
# Two host ports, both on 127.0.0.1: the page on 8080 and the gateway on 18789.
services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.10.5
    # Merges the repo config, sets the model, then runs the image entrypoint.
    command: ["sh", "/config/start.sh"]
    environment:
      # Compose refuses to start when a required value is empty.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openrouter/anthropic/claude-sonnet-5.5}
      TZ: UTC
    volumes:
      # Gateway state: sessions, approved devices, workspace.
      - openclaw-data:/home/node/.openclaw
      - ./openclaw/openclaw.json:/config/openclaw.json:ro
      - ./openclaw/start.sh:/config/start.sh:ro
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_HOST_PORT:-18789}:18789"
    # The image's own check, polled every 10s instead of every 3m.
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # As in the official compose file.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    build: ./backend
    # tini as PID 1 forwards SIGTERM to node.
    init: true
    environment:
      OPENCLAW_GATEWAY_URL: ws://openclaw-gateway:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      # Key pair of this backend. Pairing is approved once per key pair, so it lives in a volume.
      DEVICE_IDENTITY_PATH: /data/device-identity.json
      # All interfaces, so nginx in the frontend container can reach it.
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - backend-data:/data
    # No ports: only the frontend container talks to the backend.
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    # HTTP is up. The gateway connection state is in the body, not the status.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  openclaw-data:
  backend-data:
