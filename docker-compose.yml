# OpenClaw gateway. The backend and frontend services are added in later steps.
services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.10.5

    # The config is copied into the state volume before the gateway starts.
    # The image entrypoint runs "doctor --fix", which rewrites openclaw.json
    # with a rename, and a rename fails on a bind-mounted file (EBUSY).
    # "--bind lan" listens on all container interfaces, so other containers
    # can reach the gateway.
    command:
      - sh
      - -c
      - >-
        cp /config/openclaw.json /home/node/.openclaw/openclaw.json &&
        exec node /app/docker-entrypoint.mjs node dist/index.js gateway --bind lan --port 18789

    # Secrets come from .env. Compose refuses to start if one is missing.
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      TZ: UTC

    volumes:
      # Gateway state: sessions, approved devices, workspace.
      - openclaw-data:/home/node/.openclaw
      # Config from this repo, read-only. Secrets stay ${VAR} placeholders.
      - ./openclaw/openclaw.json:/config/openclaw.json:ro

    # Reachable from this machine only. Set OPENCLAW_GATEWAY_HOST_PORT in .env
    # if 18789 is already taken.
    ports:
      - "127.0.0.1:${OPENCLAW_GATEWAY_HOST_PORT:-18789}:18789"

    # Same check as the image's built-in one, polled every 10s instead of 3m.
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    # Hardening, as in the official compose file.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

volumes:
  openclaw-data:
